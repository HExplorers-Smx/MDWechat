# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX migration for modern Android Gradle Plugin builds.
android.useAndroidX=true
android.enableJetifier=true

# Keep legacy transitive/non-final R behavior to reduce source churn in the
# bundled old UI libraries during the first toolchain upgrade.
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# AGP 9.x enables built-in Kotlin support by default. Keep this explicit so
# future readers know the missing Kotlin Android plugin is intentional.
android.builtInKotlin=true
