plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blanke.mdwechat'
    compileSdk 36

    defaultConfig {
        applicationId 'com.blanke.mdwechat'
        minSdk 21
        targetSdk 36
        versionCode 38
        versionName '3.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'

    compileOnly 'de.robv.android.xposed:api:53'

    implementation project(':fab-lib')
    implementation project(':tablayout-lib')
    implementation project(':ColorPicker')

    implementation 'com.google.code.gson:gson:2.8.4'
    implementation 'com.github.Blankeer:rclayout:v1.6.0'
    implementation 'net.dongliu:apk-parser:2.5.3'
    implementation 'com.blankj:utilcode:1.19.3'
    implementation 'org.greenrobot:eventbus:3.1.1'
    implementation 'com.squareup.okhttp3:okhttp:3.11.0'
    implementation 'ru.noties:markwon:1.1.0'
    implementation 'ru.noties:markwon-image-loader:1.1.0'
    implementation 'org.jooq:jooq:3.11.11'
}

def targetPackage = 'com.tencent.mm'

tasks.register('killTargetAPP', Exec) {
    group = 'wechat'
    description = 'Force-stop WeChat after installing a debug build.'
    commandLine android.adbExecutable, 'shell', 'am', 'force-stop', targetPackage
}

tasks.register('startTargetAPP', Exec) {
    group = 'wechat'
    description = 'Start WeChat after installing a debug build.'
    commandLine android.adbExecutable, 'shell', 'monkey', '-p', targetPackage, '-c', 'android.intent.category.LAUNCHER', '1'
}

tasks.matching { it.name == 'installDebug' }.configureEach {
    finalizedBy 'killTargetAPP', 'startTargetAPP'
}
