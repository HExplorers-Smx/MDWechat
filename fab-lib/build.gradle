plugins {
    id 'com.android.library'
}

android {
    namespace 'com.github.clans.fab'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    lint {
        abortOnError false
    }
}
